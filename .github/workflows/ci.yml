name: CI Test Runner Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: sertifikat_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: pdo, pdo_pgsql, gd, mbstring, json, xml

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Configure environment settings
      run: |
        cp .env.example .env
        sed -i 's/DB_HOST=localhost/DB_HOST=127.0.0.1/g' .env
        sed -i 's/DB_PASS=your_db_password/DB_PASS=postgres/g' .env
        sed -i 's/JWT_SECRET=your_super_secret_jwt_key_here/JWT_SECRET=secure_test_key_for_jwt_auth_verification/g' .env

    - name: Run database migrations
      run: php database/migrate.php

    - name: Execute automated unit test suite
      run: php tests/run_tests.php
