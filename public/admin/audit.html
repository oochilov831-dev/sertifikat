<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audit log — Admin</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .page-head { display:flex; justify-content:space-between; align-items:center; margin-bottom: 24px; flex-wrap:wrap; gap:12px; }
    .filters { display:flex; gap:10px; flex-wrap:wrap; margin-bottom: 16px; }
    .filters input, .filters select { padding: 8px 12px; border:1px solid var(--border); border-radius:8px; font-size:13px; min-width: 160px; }
    .log-row { padding: 14px 18px; border-bottom: 1px solid var(--border); display:grid; grid-template-columns: 180px 1fr 200px 100px; gap: 16px; align-items: center; }
    .log-row:hover { background: var(--bg-soft); }
    .log-time { font-size: 12px; color: var(--text-muted); font-family: monospace; }
    .log-action { font-weight: 700; color: var(--text); font-size: 13px; }
    .log-user { font-size: 13px; }
    .log-ip { font-family: monospace; font-size: 11px; color: var(--text-muted); }
    .log-meta { font-size: 11px; color: var(--text-soft); margin-top: 4px; font-family: monospace; }
    .badge-action { display:inline-block; padding:2px 8px; border-radius:6px; font-size:10px; font-weight:700; }
    .ba-login { background:#dcfce7; color:#15803d; }
    .ba-failed { background:#fee2e2; color:#b91c1c; }
    .ba-cert { background:#eef2ff; color:#4338ca; }
    .ba-admin { background:#fef3c7; color:#92400e; }
    @media(max-width:768px) {
      .log-row { grid-template-columns: 1fr; gap:6px; }
      .log-time { order: 1; }
    }
  </style>
</head>
<body>

<nav class="navbar">
  <a href="/admin/index.html" class="nav-brand">🛡️ Admin Panel</a>
  <div class="nav-links">
    <span style="font-size:13px;color:var(--text-muted);margin-right:12px;" id="admin-name"></span>
    <button class="btn btn-outline btn-sm" onclick="logout()">Chiqish</button>
  </div>
</nav>

<div class="layout">
  <aside class="sidebar"></aside>

  <main class="main">
    <div class="page-head">
      <div>
        <h1 style="font-size:22px;font-weight:800;">📋 Audit log jurnali</h1>
        <p style="font-size:13px;color:var(--text-muted);margin-top:4px;">Tizimdagi muhim amallar tarixi</p>
      </div>
      <div>
        <span class="badge badge-primary" id="total-count">—</span>
      </div>
    </div>

    <div class="filters">
      <select id="filter-action" onchange="page=1; load()">
        <option value="">Barcha amallar</option>
      </select>
      <input type="text" id="filter-search" placeholder="Foydalanuvchi yoki target..." oninput="debounceLoad()">
      <input type="number" id="filter-userid" placeholder="User ID" oninput="debounceLoad()" style="max-width:120px;">
      <button class="btn btn-outline btn-sm" onclick="clearFilters()">Tozalash</button>
    </div>

    <div class="card" style="padding:0; overflow:hidden;">
      <div id="logs-list">
        <div style="text-align:center;padding:60px;"><div class="spinner" style="margin:auto;"></div></div>
      </div>
    </div>

    <div id="pagination" class="pagination"></div>
  </main>
</div>

<script src="/js/api.js"></script>
<script>
  requireAuth();
  const me = JSON.parse(localStorage.getItem('user') || '{}');
  if (!['admin', 'super_admin'].includes(me.role)) { location.href = '/dashboard.html'; throw ''; }
  document.getElementById('admin-name').textContent = me.name || '';

  const ACTION_LABELS = {
    'login': 'Tizimga kirish',
    'login.failed': 'Muvaffaqiyatsiz kirish',
    'register': "Ro'yxatdan o'tish",
    'password.change': "Parol o'zgartirish",
    'cert.create': 'Sertifikat yaratish',
    'cert.revoke': 'Sertifikat bekor qilish',
    'cert.restore': 'Sertifikatni tiklash',
    'cert.delete': "Sertifikat o'chirish",
    'account.delete': "Hisobni o'chirish",
    '2fa.enable': '2FA yoqish',
    '2fa.disable': "2FA o'chirish",
    'email.verify': 'Email tasdiqlash',
    'admin.user.block': 'Admin: foydalanuvchini bloklash',
    'admin.user.unblock': 'Admin: foydalanuvchini ochish',
    'admin.broadcast.send': 'Admin: ommaviy email',
    'admin.template.approve': 'Admin: shablon tasdiqlash',
    'admin.template.reject': 'Admin: shablon rad etish',
  };

  function actionBadgeClass(action) {
    if (action.includes('failed')) return 'ba-failed';
    if (action.includes('admin')) return 'ba-admin';
    if (action.includes('cert'))  return 'ba-cert';
    return 'ba-login';
  }

  let page = 1;
  let totalPages = 1;
  let debTimer = null;

  function debounceLoad() {
    clearTimeout(debTimer);
    debTimer = setTimeout(() => { page = 1; load(); }, 350);
  }

  async function load() {
    const action  = document.getElementById('filter-action').value;
    const search  = document.getElementById('filter-search').value.trim();
    const userId  = document.getElementById('filter-userid').value.trim();

    const params = new URLSearchParams({ page });
    if (action)  params.set('action', action);
    if (search)  params.set('search', search);
    if (userId)  params.set('user_id', userId);

    try {
      const data = await Api.get('/admin/audit-logs?' + params.toString());
      totalPages = data.total_pages;
      document.getElementById('total-count').textContent = `Jami: ${data.total}`;

      // Action dropdownni to'ldirish
      const sel = document.getElementById('filter-action');
      if (sel.options.length === 1 && data.actions) {
        data.actions.forEach(a => {
          const opt = document.createElement('option');
          opt.value = a;
          opt.textContent = ACTION_LABELS[a] || a;
          sel.appendChild(opt);
        });
        if (action) sel.value = action;
      }

      if (!data.items.length) {
        document.getElementById('logs-list').innerHTML =
          '<div style="text-align:center;padding:60px;color:var(--text-muted);">Yozuvlar topilmadi</div>';
        document.getElementById('pagination').innerHTML = '';
        return;
      }

      document.getElementById('logs-list').innerHTML = data.items.map(it => `
        <div class="log-row">
          <div class="log-time">${new Date(it.created_at).toLocaleString('uz-UZ')}</div>
          <div>
            <span class="badge-action ${actionBadgeClass(it.action)}">${ACTION_LABELS[it.action] || it.action}</span>
            ${it.target ? `<span style="color:var(--text-muted);font-size:12px;margin-left:6px;">→ ${esc(it.target)}#${it.target_id || '?'}</span>` : ''}
            ${it.meta ? `<div class="log-meta">${esc(typeof it.meta === 'string' ? it.meta : JSON.stringify(it.meta))}</div>` : ''}
          </div>
          <div class="log-user">${it.user_name ? esc(it.user_name) : '<em style="color:var(--text-soft);">tizim</em>'}<br><small style="color:var(--text-muted);">${esc(it.user_email || '')}</small></div>
          <div class="log-ip">${esc(it.ip || '—')}</div>
        </div>
      `).join('');

      renderPagination();
    } catch (e) {
      document.getElementById('logs-list').innerHTML =
        `<div style="text-align:center;padding:40px;color:var(--danger);">Xato: ${e.message}</div>`;
    }
  }

  function renderPagination() {
    const el = document.getElementById('pagination');
    if (totalPages <= 1) { el.innerHTML = ''; return; }
    let html = '';
    for (let i = 1; i <= Math.min(totalPages, 10); i++) {
      html += `<button class="page-btn ${i === page ? 'active' : ''}" onclick="page=${i}; load()">${i}</button>`;
    }
    el.innerHTML = html;
  }

  function clearFilters() {
    document.getElementById('filter-action').value  = '';
    document.getElementById('filter-search').value  = '';
    document.getElementById('filter-userid').value  = '';
    page = 1;
    load();
  }

  function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  load();
</script>
<script src="/js/i18n.js"></script>
<script src="/js/admin-sidebar.js"></script>
</body>
</html>
