<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shablon moderatsiyasi — Admin</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .pending-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; }
    .pcard { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow-sm); }
    .pcard img { width: 100%; height: 180px; object-fit: cover; background: #f8fafc; }
    .pbody { padding: 16px; }
    .pname { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
    .pmeta { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
    .pdesc { font-size: 13px; color: var(--text-2); margin: 8px 0 12px; line-height: 1.5; }
    .pactions { display: flex; gap: 8px; }
    .pactions button { flex: 1; }
  </style>
</head>
<body>

<nav class="navbar">
  <a href="/admin/index.html" class="nav-brand">🛡️ Admin Panel</a>
  <div class="nav-links">
    <span style="font-size:13px;color:var(--text-muted);margin-right:12px;" id="admin-name"></span>
    <button class="btn btn-outline btn-sm" onclick="logout()">Chiqish</button>
  </div>
</nav>

<div class="layout">
  <aside class="sidebar"></aside>

  <main class="main">
    <h1 style="font-size:22px;font-weight:800;margin-bottom:8px;">🔍 Shablon moderatsiyasi</h1>
    <p style="color:var(--text-muted);margin-bottom:24px;">Foydalanuvchilar yuborgan, tasdiqlash kutilayotgan shablonlar</p>

    <div id="pending-list">
      <div style="text-align:center;padding:60px;"><div class="spinner" style="margin:auto;"></div></div>
    </div>
  </main>
</div>

<script src="/js/api.js"></script>
<script src="/js/toast.js"></script>
<script>
  requireAuth();
  const me = JSON.parse(localStorage.getItem('user') || '{}');
  if (!['admin', 'super_admin'].includes(me.role)) { location.href = '/dashboard.html'; throw ''; }
  document.getElementById('admin-name').textContent = me.name || '';

  async function load() {
    try {
      const d = await Api.get('/admin/templates/pending');
      const el = document.getElementById('pending-list');
      if (!d.items.length) {
        el.innerHTML = '<div style="text-align:center;padding:60px;color:var(--text-muted);"><div style="font-size:48px;margin-bottom:14px;">✨</div>Kutilayotgan shablonlar yo\'q</div>';
        return;
      }
      el.innerHTML = `<div class="pending-grid">${d.items.map(t => `
        <div class="pcard">
          <img src="/${esc(t.preview_url)}" alt="">
          <div class="pbody">
            <div class="pname">${esc(t.name)}</div>
            <div class="pmeta">${esc(t.submitter_name || '—')} <small>(${esc(t.submitter_email || '')})</small></div>
            <div class="pmeta">📅 ${new Date(t.submitted_at).toLocaleString('uz-UZ')} &middot; ${esc(t.category || '—')} &middot; ${esc(t.orientation || 'landscape')}</div>
            ${t.description ? `<div class="pdesc">${esc(t.description)}</div>` : ''}
            <div class="pactions">
              <button class="btn btn-primary btn-sm" onclick="approve(${t.id})">✓ Tasdiqlash</button>
              <button class="btn btn-outline btn-sm" onclick="reject(${t.id})" style="color:#ef4444;border-color:#fecaca;">✗ Rad etish</button>
            </div>
          </div>
        </div>
      `).join('')}</div>`;
    } catch (e) {
      window.Toast?.error(e.message);
    }
  }

  async function approve(id) {
    try {
      await Api.post('/admin/templates/' + id + '/approve', {});
      window.Toast?.success('Tasdiqlandi');
      load();
    } catch (e) { window.Toast?.error(e.message); }
  }

  async function reject(id) {
    const reason = prompt('Rad etish sababi:');
    if (!reason || !reason.trim()) return;
    try {
      await Api.post('/admin/templates/' + id + '/reject', { reason });
      window.Toast?.success('Rad etildi');
      load();
    } catch (e) { window.Toast?.error(e.message); }
  }

  function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  load();
</script>
<script src="/js/i18n.js"></script>
<script src="/js/admin-sidebar.js"></script>
</body>
</html>
