<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Admin Panel</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .kpi { background: #fff; border-radius: 14px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.06); display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--border); }
    .kpi-icon { font-size: 28px; }
    .kpi-val  { font-size: 28px; font-weight: 800; color: #1e293b; line-height: 1; }
    .kpi-lbl  { font-size: 12px; color: #94a3b8; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
    .kpi-sub  { font-size: 12px; color: #64748b; }
    .kpi-up   { color: #059669; font-size: 12px; font-weight: 700; }
    .kpi-down { color: #ef4444; font-size: 12px; font-weight: 700; }

    .charts-row { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 20px; }
    @media(max-width: 900px) { .charts-row { grid-template-columns: 1fr; } }
    .card h2 { font-size: 15px; font-weight: 700; color: #1e293b; margin-bottom: 18px; }

    /* Bar chart */
    .bar-chart { display: flex; flex-direction: column; gap: 10px; }
    .bar-row   { display: flex; align-items: center; gap: 12px; }
    .bar-lbl   { width: 60px; font-size: 11px; color: #94a3b8; flex-shrink: 0; text-align: right; }
    .bar-track { flex: 1; background: #f1f5f9; border-radius: 6px; height: 20px; overflow: hidden; }
    .bar-fill  { height: 100%; border-radius: 6px; background: linear-gradient(90deg, #3157d5, #0f9f8f); transition: width .6s; display: flex; align-items: center; justify-content: flex-end; padding-right: 6px; }
    .bar-fill span { font-size: 10px; color: #fff; font-weight: 700; white-space: nowrap; }
    .bar-count { width: 50px; font-size: 12px; font-weight: 700; color: #475569; text-align: right; }

    /* Pie chart */
    .pie-list { display: flex; flex-direction: column; gap: 12px; }
    .pie-item { display: flex; align-items: center; gap: 10px; }
    .pie-dot  { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
    .pie-name { font-size: 13px; color: #475569; flex: 1; }
    .pie-count{ font-size: 13px; font-weight: 700; color: #1e293b; }
    .pie-pct  { font-size: 12px; color: #94a3b8; }

    /* Bottom row */
    .bottom-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media(max-width: 900px) { .bottom-row { grid-template-columns: 1fr; } }
    .top-user   { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #f1f5f9; }
    .top-user:last-child { border: none; padding-bottom: 0; }
    .top-user-rank { width: 28px; height: 28px; border-radius: 50%; background: #edf3ff; color: var(--primary); font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .top-user-info { flex: 1; min-width: 0; }
    .top-user-name { font-size: 13px; font-weight: 600; color: #1e293b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .top-user-email { font-size: 11px; color: #94a3b8; }
    .top-user-certs { font-size: 13px; font-weight: 700; color: var(--primary); flex-shrink: 0; }

    .daily-grid { display: flex; align-items: flex-end; gap: 3px; height: 80px; }
    .daily-bar  { flex: 1; background: var(--primary); border-radius: 3px 3px 0 0; min-height: 2px; transition: height .4s; cursor: pointer; position: relative; }
    .daily-bar:hover::after { content: attr(data-tip); position: absolute; bottom: 105%; left: 50%; transform: translateX(-50%); background: #1e293b; color: #fff; font-size: 10px; padding: 3px 6px; border-radius: 4px; white-space: nowrap; pointer-events: none; }
  </style>
</head>
<body>

<nav class="navbar">
  <a href="/admin/index.html" class="nav-brand">🛡️ Admin Panel</a>
  <div class="nav-links">
    <span style="font-size:13px;color:var(--text-muted);margin-right:12px;" id="admin-name"></span>
    <button class="btn btn-outline btn-sm" onclick="logout()">Chiqish</button>
  </div>
</nav>

<div class="layout">
  <aside class="sidebar"></aside>

  <main class="main">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
      <h1 style="font-size:22px; font-weight:800;">📊 Statistika dashboardi</h1>
    </div>

    <!-- KPI -->
    <div class="kpi-grid" id="kpi-grid">
      <div class="kpi" style="grid-column:1/-1;text-align:center;padding:40px;"><div style="color:#94a3b8;">Yuklanmoqda...</div></div>
    </div>

    <!-- Grafiklar -->
    <div class="charts-row">
      <div class="card">
        <h2>📈 Oylik daromad (12 oy)</h2>
        <div class="bar-chart" id="monthly-chart"></div>
      </div>
      <div class="card">
        <h2>💎 Tarif taqsimoti</h2>
        <div class="pie-list" id="plan-chart"></div>
      </div>
    </div>

    <!-- Pastki qator -->
    <div class="bottom-row">
      <div class="card">
        <h2>🏆 Top 5 faol foydalanuvchi</h2>
        <div id="top-users"></div>
      </div>
      <div class="card">
        <h2>📅 Oxirgi 30 kunlik sertifikatlar</h2>
        <div class="daily-grid" id="daily-chart"></div>
        <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:10px;color:#94a3b8;" id="daily-labels"></div>
      </div>
    </div>
  </main>
</div>

<script src="/js/api.js"></script>
<script>
  requireAuth(true);
  const user = JSON.parse(localStorage.getItem('user') || '{}');
  if (!['admin', 'super_admin'].includes(user.role)) { location.href = '/dashboard.html'; }
  document.getElementById('admin-name').textContent = user.name;

  const planColors = { free: '#94a3b8', standard: '#3157d5', pro: '#c58b22' };
  const planNames  = { free: 'Bepul', standard: 'Standart', pro: 'Pro' };

  async function loadStats() {
    let s;
    try {
      s = await Api.admin.stats();
    } catch (e) {
      document.getElementById('kpi-grid').innerHTML =
        `<div class="kpi" style="grid-column:1/-1;text-align:center;padding:36px;color:#b91c1c;">${esc(e.message || 'Statistika yuklanmadi')}</div>`;
      return;
    }

    // KPI
    document.getElementById('kpi-grid').innerHTML = `
      <div class="kpi"><div class="kpi-icon">👥</div><div class="kpi-val">${n(s.total_users)}</div><div class="kpi-lbl">Foydalanuvchilar</div><div class="kpi-sub kpi-up">+${n(s.new_users_today)} bugun</div></div>
      <div class="kpi"><div class="kpi-icon">📜</div><div class="kpi-val">${n(s.total_certs)}</div><div class="kpi-lbl">Sertifikatlar</div><div class="kpi-sub kpi-up">+${n(s.certs_today)} bugun</div></div>
      <div class="kpi"><div class="kpi-icon">💰</div><div class="kpi-val">${fmt.money(s.total_revenue)}</div><div class="kpi-lbl">Jami daromad</div><div class="kpi-sub">Bu oy: ${fmt.money(s.revenue_this_month)}</div></div>
      <div class="kpi"><div class="kpi-icon">✅</div><div class="kpi-val">${n(s.active_subs)}</div><div class="kpi-lbl">Faol obunalar</div><div class="kpi-sub">Konversiya: ${s.conversion_rate}%</div></div>
      <div class="kpi"><div class="kpi-icon">💳</div><div class="kpi-val">${n(s.total_payments_success)}</div><div class="kpi-lbl">Muvaffaqiyatli to'lov</div><div class="kpi-sub">Kutilayotgan: ${n(s.total_payments_pending)}</div></div>
      <div class="kpi"><div class="kpi-icon">📡</div><div class="kpi-val">${n(s.total_scans)}</div><div class="kpi-lbl">QR skanlar</div><div class="kpi-sub">Jami tekshiruvlar</div></div>`;

    // Oylik daromad bar chart
    const chart = s.monthly_chart || [];
    const maxR  = Math.max(...chart.map(m => +m.revenue), 1);
    document.getElementById('monthly-chart').innerHTML = chart.length
      ? chart.map(m => `
        <div class="bar-row">
          <div class="bar-lbl">${m.month?.slice(5)}</div>
          <div class="bar-track">
            <div class="bar-fill" style="width:${(+m.revenue/maxR*100).toFixed(1)}%">
              <span>${fmt.money(m.revenue)}</span>
            </div>
          </div>
          <div class="bar-count">${m.count} ta</div>
        </div>`).join('')
      : '<p style="color:#94a3b8;text-align:center;padding:20px;">Ma\'lumot yo\'q</p>';

    // Plan taqsimoti
    const plans = s.plan_distribution || [];
    const total = plans.reduce((a, p) => a + +p.count, 0) || 1;
    document.getElementById('plan-chart').innerHTML = plans.length
      ? plans.map(p => {
          const pct = (+p.count / total * 100).toFixed(1);
          const col = planColors[p.plan] || '#3157d5';
          return `<div class="pie-item" style="flex-direction:column;align-items:flex-start;">
            <div style="display:flex;align-items:center;gap:8px;width:100%;">
              <div class="pie-dot" style="background:${col};"></div>
              <span class="pie-name">${planNames[p.plan] || p.plan}</span>
              <span class="pie-count">${p.count}</span>
              <span class="pie-pct">${pct}%</span>
            </div>
            <div style="width:100%;background:#f1f5f9;border-radius:3px;height:6px;margin-top:4px;">
              <div style="width:${pct}%;height:100%;border-radius:3px;background:${col};transition:width .6s;"></div>
            </div>
          </div>`;
        }).join('')
      : '<p style="color:#94a3b8;text-align:center;">Ma\'lumot yo\'q</p>';

    // Top foydalanuvchilar
    const tops = s.top_users || [];
    document.getElementById('top-users').innerHTML = tops.length
      ? tops.map((u, i) => `
        <div class="top-user">
          <div class="top-user-rank">${i+1}</div>
          <div class="top-user-info">
            <div class="top-user-name">${esc(u.name)}</div>
            <div class="top-user-email">${esc(u.email||'')}</div>
          </div>
          <div class="top-user-certs">${u.cert_count} ta</div>
        </div>`).join('')
      : '<p style="color:#94a3b8;text-align:center;padding:20px;">Ma\'lumot yo\'q</p>';

    // Kunlik sertifikatlar
    const daily   = s.daily_certs || [];
    const maxDay  = Math.max(...daily.map(d => +d.count), 1);
    const barHtml = daily.map(d => {
      const h   = Math.max(4, Math.round(+d.count / maxDay * 76));
      const tip = `${d.day?.slice(5)}: ${d.count} ta`;
      return `<div class="daily-bar" style="height:${h}px;opacity:.75;" data-tip="${tip}" title="${tip}"></div>`;
    }).join('');
    document.getElementById('daily-chart').innerHTML = barHtml ||
      '<div style="color:#94a3b8;font-size:12px;text-align:center;width:100%;align-self:center;">Ma\'lumot yo\'q</div>';

    // Birinchi va oxirgi kunlarni ko'rsatish
    if (daily.length >= 2) {
      document.getElementById('daily-labels').innerHTML =
        `<span>${daily[0]?.day?.slice(5)}</span><span>${daily.at(-1)?.day?.slice(5)}</span>`;
    }
  }

  function n(v) { return Number(v || 0).toLocaleString(); }
  function esc(s) { return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  loadStats();
</script>
<script src="/js/i18n.js"></script>
<script src="/js/admin-sidebar.js"></script>
</body>
</html>
