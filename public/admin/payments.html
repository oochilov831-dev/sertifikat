<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To'lovlar — Admin Panel</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .filters { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .filter-select { padding: 9px 14px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 14px; color: #1e293b; background: #fff; cursor: pointer; }
    .filter-select:focus { outline: none; border-color: var(--primary); }
    .search-input { flex: 1; min-width: 200px; padding: 9px 14px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 14px; }
    .search-input:focus { outline: none; border-color: var(--primary); }

    .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: #fff; border-radius: 14px; padding: 18px 20px; box-shadow: 0 2px 8px rgba(0,0,0,.06); border: 1px solid var(--border); }
    .stat-label { font-size: 12px; color: #94a3b8; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
    .stat-val { font-size: 26px; font-weight: 800; color: #1e293b; }
    .stat-sub { font-size: 12px; color: #64748b; margin-top: 2px; }

    .table-card { background: #fff; border-radius: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.06); overflow: hidden; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; }
    th { padding: 14px 16px; text-align: left; font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: .06em; background: #f8fafc; border-bottom: 1px solid #e2e8f0; }
    td { padding: 14px 16px; font-size: 14px; color: #1e293b; border-bottom: 1px solid #f1f5f9; }
    tr:last-child td { border: none; }
    tr:hover td { background: #fafbff; }

    .badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
    .badge-success { background: #dcfce7; color: #15803d; }
    .badge-pending { background: #fef9c3; color: #854d0e; }
    .badge-failed  { background: #fee2e2; color: #b91c1c; }
    .badge-refunded{ background: #ede9fe; color: #6d28d9; }
    .provider-badge { background: #f1f5f9; color: #475569; padding: 3px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; }

    .amount-cell { font-weight: 700; color: #059669; font-size: 15px; }
    .user-cell { display: flex; flex-direction: column; }
    .user-cell .name { font-weight: 600; }
    .user-cell .email { font-size: 12px; color: #94a3b8; }

    .pagination { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 20px; }
    .page-btn { width: 36px; height: 36px; border: 2px solid #e2e8f0; border-radius: 8px; background: #fff; font-size: 14px; font-weight: 600; color: #64748b; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .2s; }
    .page-btn:hover { border-color: var(--primary); color: var(--primary); }
    .page-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    .page-info { font-size: 13px; color: #94a3b8; }
  </style>
</head>
<body>

<nav class="navbar">
  <a href="/admin/index.html" class="nav-brand">🛡️ Admin Panel</a>
  <div class="nav-links">
    <span style="font-size:13px;color:var(--text-muted);margin-right:12px;" id="admin-name"></span>
    <button class="btn btn-outline btn-sm" onclick="logout()">Chiqish</button>
  </div>
</nav>

<div class="layout">
  <aside class="sidebar"></aside>

  <main class="main">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
      <h1 style="font-size:22px; font-weight:800;">💳 To'lovlar boshqaruvi</h1>
      <button onclick="exportCsv()" style="padding:9px 18px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;">⬇ CSV export</button>
    </div>

    <!-- Statistika -->
    <div class="stats-row" id="stats-row">
      <div class="stat-card"><div class="stat-label">Jami daromad</div><div class="stat-val" id="s-total">—</div><div class="stat-sub">Barcha vaqt</div></div>
      <div class="stat-card"><div class="stat-label">Bu oy</div><div class="stat-val" id="s-month">—</div><div class="stat-sub" id="s-month-count">— ta to'lov</div></div>
      <div class="stat-card"><div class="stat-label">Muvaffaqiyatli</div><div class="stat-val" id="s-success">—</div><div class="stat-sub">ta tranzaksiya</div></div>
      <div class="stat-card"><div class="stat-label">Kutilayotgan</div><div class="stat-val" id="s-pending">—</div><div class="stat-sub">ta to'lov</div></div>
    </div>

    <!-- Filtrlar -->
    <div class="filters">
      <input type="text" class="search-input" id="search" placeholder="🔍 Foydalanuvchi, tranzaksiya ID..." oninput="debounceLoad()">
      <select class="filter-select" id="status-filter" onchange="load(1)">
        <option value="">Barcha holatlar</option>
        <option value="success">Muvaffaqiyatli</option>
        <option value="pending">Kutilayotgan</option>
        <option value="failed">Muvaffaqiyatsiz</option>
        <option value="refunded">Qaytarilgan</option>
      </select>
      <select class="filter-select" id="provider-filter" onchange="load(1)">
        <option value="">Barcha tizimlar</option>
        <option value="click">Click</option>
        <option value="payme">Payme</option>
        <option value="uzum">Uzum</option>
        <option value="free">Bepul</option>
      </select>
    </div>

    <!-- Jadval -->
    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Foydalanuvchi</th>
            <th>Miqdor</th>
            <th>Tarif</th>
            <th>Tizim</th>
            <th>Holat</th>
            <th>Tranzaksiya ID</th>
            <th>Sana</th>
            <th>Amal</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="9" style="text-align:center;padding:40px;color:#94a3b8;">Yuklanmoqda...</td></tr>
        </tbody>
      </table>
      <div class="pagination" id="pagination"></div>
    </div>
  </main>
</div>

<script src="/js/api.js"></script>
<script>
  requireAuth(true);
  const me = JSON.parse(localStorage.getItem('user') || '{}');
  if (!['admin', 'super_admin'].includes(me.role)) { location.href = '/dashboard.html'; throw ''; }
  document.getElementById('admin-name').textContent = me.name || '';

  let debTimer;
  function debounceLoad() { clearTimeout(debTimer); debTimer = setTimeout(() => load(1), 400); }

  async function loadStats() {
    try {
      const d = await Api.admin.stats();
      document.getElementById('s-total').textContent   = fmt.money(d.total_revenue);
      document.getElementById('s-month').textContent   = fmt.money(d.revenue_this_month);
      document.getElementById('s-success').textContent = d.total_payments_success ?? '—';
      document.getElementById('s-pending').textContent = d.total_payments_pending ?? '—';
    } catch (e) {
      toast(e.message || 'Statistika yuklanmadi', 'error');
    }
  }

  async function load(page = 1) {
    const search   = document.getElementById('search').value.trim();
    const status   = document.getElementById('status-filter').value;
    const provider = document.getElementById('provider-filter').value;

    const params = new URLSearchParams({ page });
    if (search)   params.set('search', search);
    if (status)   params.set('status', status);
    if (provider) params.set('provider', provider);

    try {
      const data = await Api.request('GET', '/admin/payments?' + params);
      const { items, total, page: pg, per_page } = data;
      renderTable(items, pg, per_page, total);
      renderPagination(pg, Math.ceil(total / per_page));
    } catch (e) {
      document.getElementById('tbody').innerHTML =
        `<tr><td colspan="9" style="text-align:center;padding:40px;color:#b91c1c;">${esc(e.message || "To'lovlar yuklanmadi")}</td></tr>`;
      document.getElementById('pagination').innerHTML = '';
    }
  }

  function renderTable(rows, page, perPage, total) {
    const tbody = document.getElementById('tbody');
    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:40px;color:#94a3b8;">To\'lov topilmadi</td></tr>';
      return;
    }
    const statusMap = {
      success:  '<span class="badge badge-success">✓ Muvaffaqiyatli</span>',
      pending:  '<span class="badge badge-pending">⏳ Kutilmoqda</span>',
      failed:   '<span class="badge badge-failed">✗ Muvaffaqiyatsiz</span>',
      refunded: '<span class="badge badge-refunded">↩ Qaytarilgan</span>',
    };
    tbody.innerHTML = rows.map((p, i) => `
      <tr>
        <td style="color:#94a3b8;font-size:12px;">${(page - 1) * perPage + i + 1}</td>
        <td><div class="user-cell"><span class="name">${esc(p.user_name)}</span><span class="email">${esc(p.user_email || '')}</span></div></td>
        <td class="amount-cell">${fmt.money(p.amount)}</td>
        <td><span class="provider-badge">${esc(p.plan || '—')}</span></td>
        <td><span class="provider-badge">${esc(p.provider)}</span></td>
        <td>${statusMap[p.status] || p.status}</td>
        <td style="font-family:monospace;font-size:12px;color:#6366f1;">${esc(p.transaction_id || '—')}</td>
        <td style="color:#64748b;font-size:13px;">${fmt.date(p.created_at)}</td>
        <td>${paymentActions(p)}</td>
      </tr>`).join('');
  }

  function renderPagination(current, total) {
    const el = document.getElementById('pagination');
    if (total <= 1) { el.innerHTML = ''; return; }
    let html = '';
    for (let i = 1; i <= total; i++) {
      html += `<button class="page-btn${i === current ? ' active' : ''}" onclick="load(${i})">${i}</button>`;
    }
    el.innerHTML = `<span class="page-info">${current}/${total} sahifa</span>` + html;
  }

  function paymentActions(p) {
    if (p.status !== 'pending') return '<span style="color:#94a3b8;font-size:12px;">—</span>';
    return `
      <button class="page-btn" title="Tasdiqlash" onclick="approvePayment(${p.id})" style="width:auto;padding:0 10px;color:#15803d;border-color:#bbf7d0;">OK</button>
      <button class="page-btn" title="Rad etish" onclick="rejectPayment(${p.id})" style="width:auto;padding:0 10px;color:#b91c1c;border-color:#fecaca;">Rad</button>
    `;
  }

  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function exportCsv() {
    const data = await Api.request('GET', '/admin/payments?limit=200');
    const rows = data.items;
    const header = ['ID','Foydalanuvchi','Email','Miqdor','Tarif','Tizim','Holat','Tranzaksiya ID','Sana'];
    const lines = [header.join(','), ...rows.map(p =>
      [p.id, `"${p.user_name}"`, p.user_email, p.amount, p.plan, p.provider, p.status, p.transaction_id, p.created_at].join(',')
    )];
    const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `payments_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
  }

  async function approvePayment(id) {
    if (!confirm("To'lov arizasini tasdiqlab, obunani faollashtirasizmi?")) return;
    try {
      await Api.request('PUT', `/admin/payments/${id}/approve`);
      toast("To'lov tasdiqlandi");
      loadStats();
      load(1);
    } catch (e) {
      toast(e.message, 'error');
    }
  }

  async function rejectPayment(id) {
    const reason = prompt('Rad etish sababi:', "To'lov tasdiqlanmadi") || '';
    try {
      await Api.request('PUT', `/admin/payments/${id}/reject`, { reason });
      toast("To'lov rad etildi");
      loadStats();
      load(1);
    } catch (e) {
      toast(e.message, 'error');
    }
  }

  loadStats();
  load(1);
</script>
<script src="/js/i18n.js"></script>
<script src="/js/admin-sidebar.js"></script>
</body>
</html>
