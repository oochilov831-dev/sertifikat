<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kirish — Sertifikat Tizimi</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    @keyframes slideIn { from { transform: translateX(100px); opacity:0; } to { transform: translateX(0); opacity:1; } }
  </style>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div style="text-align:center; margin-bottom:12px;">
      <a href="/templates.html" style="font-size:13px; color:var(--text-muted);">← Shablonlarni ko'rish</a>
    </div>
    <div class="auth-logo">
      <h1>🎓 Sertifikat</h1>
      <p>Professional sertifikatlar platformasi</p>
    </div>

    <div class="auth-tab">
      <button class="active" id="tab-login" onclick="switchTab('login')">Kirish</button>
      <button id="tab-register" onclick="switchTab('register')">Ro'yxatdan o'tish</button>
    </div>

    <!-- Login form -->
    <form id="login-form">
      <div id="login-alert"></div>
      <div class="form-group">
        <label class="form-label">Email yoki telefon</label>
        <input type="text" class="form-control" id="login-input" placeholder="+998 90 123 45 67 yoki email" required>
      </div>
      <div class="form-group">
        <label class="form-label">Parol</label>
        <input type="password" class="form-control" id="login-pass" placeholder="Parolingiz" required>
        <div style="text-align:right; margin-top:6px;">
          <a href="/forgot.html" style="font-size:13px; color:var(--primary);">Parolni unutdingizmi?</a>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-full btn-lg" id="login-btn">Kirish</button>
    </form>

    <!-- Register form -->
    <form id="register-form" style="display:none;">
      <div id="register-alert"></div>
      <div class="form-group">
        <label class="form-label">To'liq ismingiz</label>
        <input type="text" class="form-control" id="reg-name" placeholder="Ism Familiya" required>
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" id="reg-email" placeholder="email@misol.uz">
      </div>
      <div class="form-group">
        <label class="form-label">Telefon raqam</label>
        <input type="text" class="form-control" id="reg-phone" placeholder="+998901234567">
      </div>
      <div class="form-group">
        <label class="form-label">Parol</label>
        <input type="password" class="form-control" id="reg-pass" placeholder="Kamida 6 belgi" required>
      </div>
      <button type="submit" class="btn btn-primary btn-full btn-lg" id="register-btn">
        Ro'yxatdan o'tish
      </button>
    </form>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
  requireGuest();

  function switchTab(tab) {
    document.getElementById('login-form').style.display    = tab === 'login'    ? '' : 'none';
    document.getElementById('register-form').style.display = tab === 'register' ? '' : 'none';
    document.getElementById('tab-login').classList.toggle('active',    tab === 'login');
    document.getElementById('tab-register').classList.toggle('active', tab === 'register');
  }

  let pendingLogin = null;

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn   = document.getElementById('login-btn');
    const alert = document.getElementById('login-alert');
    alert.innerHTML = '';
    btn.disabled = true;
    btn.textContent = 'Kirilmoqda...';

    const payload = {
      login:    document.getElementById('login-input').value,
      password: document.getElementById('login-pass').value,
    };

    // 2FA kod ko'rsatilgan bo'lsa, qo'shamiz
    const totpInput = document.getElementById('totp-input');
    if (totpInput && totpInput.value.trim()) {
      payload.totp_code = totpInput.value.trim();
    }

    try {
      const res = await Api.auth.login(payload);

      // 2FA talab qilingan
      if (res.requires_2fa && !payload.totp_code) {
        alert.innerHTML = `
          <div class="alert alert-info" style="margin-bottom:14px;">
            🔐 Authenticator ilovangizdagi 6 raqamli kodni kiriting
          </div>
          <input id="totp-input" type="text" inputmode="numeric" maxlength="6" class="form-control" placeholder="000000" style="text-align:center;font-size:22px;letter-spacing:8px;margin-bottom:10px;" autofocus>
          <p style="font-size:12px;color:var(--text-muted);text-align:center;">
            <a href="#" onclick="useRecovery(event)">Recovery kod bilan kirish</a>
          </p>`;
        btn.disabled = false;
        btn.textContent = 'Tasdiqlash';
        setTimeout(() => document.getElementById('totp-input')?.focus(), 100);
        return;
      }

      localStorage.setItem('token', res.token);
      localStorage.setItem('user',  JSON.stringify(res.user));
      window.location.href = ['admin', 'super_admin'].includes(res.user.role) ? '/admin/index.html' : '/dashboard.html';
    } catch (err) {
      alert.innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
      btn.disabled = false;
      btn.textContent = 'Kirish';
    }
  });

  function useRecovery(e) {
    e.preventDefault();
    const alert = document.getElementById('login-alert');
    alert.innerHTML = `
      <div class="alert alert-info" style="margin-bottom:14px;">Recovery kodingizni kiriting (xxxx-xxxx)</div>
      <input id="totp-input" name="recovery_code" type="text" class="form-control" placeholder="xxxx-xxxx" style="text-align:center;font-family:monospace;margin-bottom:10px;" autofocus>`;
    // Submit handler shu input qiymatini totp_code o'rniga recovery_code sifatida yuborsin
    const form = document.getElementById('login-form');
    form.addEventListener('submit', async function recHandler(ev) {
      ev.preventDefault();
      ev.stopPropagation();
      form.removeEventListener('submit', recHandler, true);
      const code = document.getElementById('totp-input').value.trim();
      try {
        const res = await Api.auth.login({
          login:    document.getElementById('login-input').value,
          password: document.getElementById('login-pass').value,
          recovery_code: code,
        });
        localStorage.setItem('token', res.token);
        localStorage.setItem('user', JSON.stringify(res.user));
        window.location.href = ['admin', 'super_admin'].includes(res.user.role) ? '/admin/index.html' : '/dashboard.html';
      } catch (err) {
        document.getElementById('login-alert').innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
      }
    }, true);
  }

  document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn   = document.getElementById('register-btn');
    const alert = document.getElementById('register-alert');
    alert.innerHTML = '';
    btn.disabled = true;
    btn.textContent = 'Yaratilmoqda...';

    try {
      const res = await Api.auth.register({
        name:     document.getElementById('reg-name').value,
        email:    document.getElementById('reg-email').value,
        phone:    document.getElementById('reg-phone').value,
        password: document.getElementById('reg-pass').value,
      });
      localStorage.setItem('token', res.token);
      localStorage.setItem('user',  JSON.stringify(res.user));
      window.location.href = '/dashboard.html';
    } catch (err) {
      const msg = err.errors
        ? Object.values(err.errors).join('<br>')
        : err.message;
      alert.innerHTML = `<div class="alert alert-danger">${msg}</div>`;
      btn.disabled = false;
      btn.textContent = 'Ro\'yxatdan o\'tish';
    }
  });
</script>
</body>
</html>
